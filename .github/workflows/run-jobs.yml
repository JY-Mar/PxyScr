name: Generate Subscribe Scripts

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      force_update:
        description: "强制更新配置"
        required: false
        default: false
        type: boolean

  # main分支提交触发
  push:
    branches:
      - main
    paths:
      - '**/*.js'
      - '**/*.conf'

# 设置权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务同时运行
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  detect-icons:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      - name: 🗃️ Create output directory and copy something
        run: |
          mkdir -p docs
          cp -r scripts/* docs/

